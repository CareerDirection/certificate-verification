<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Career Direction — Certificate Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 880px;
      margin: 36px auto;
      color: #222;
      padding: 0 16px;
    }
    header { text-align:center; margin-bottom:18px; }
    header img { max-width:240px; height:auto; }
    h1 { margin: 6px 0 14px; font-size:22px; text-align:center; }
    .controls {
      display:flex;
      gap:8px;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom: 14px;
    }
    input[type="text"] {
      padding:10px;
      font-size:16px;
      width:320px;
      box-sizing:border-box;
    }
    button {
      padding:10px 18px;
      font-size:16px;
      cursor:pointer;
    }
    #result {
      margin-top:18px;
      background:#fafafa;
      padding:16px;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.06);
    }
    .valid { color: #0a7d3b; font-weight:700; }
    .invalid { color: #c53030; font-weight:700; }
    p { margin:8px 0; }
    .key { color:#555; width:140px; display:inline-block; font-weight:600; }
    .small { font-size:13px; color:#666; }
    @media (max-width:520px) {
      input[type="text"] { width:100%; }
      .controls { flex-direction:column; }
    }
  </style>
</head>
<body>

  <header>
    <!-- Replace with your logo file or remove -->
    <img src="logo.png" alt="Career Direction Logo" />
    <h1>Certificate & Hackathon Verification</h1>
    <div class="small">Enter the certificate or hackathon ID (example: <strong>CDCERT2025-000</strong> or <strong>CDHACK2025-001</strong>).</div>
  </header>

  <div class="controls">
    <input id="certID" type="text" placeholder="Enter Cert/Hack ID (eg: CDCERT2025-000)" aria-label="Certificate ID">
    <button id="btnVerify">Verify</button>
  </div>

  <div id="result" aria-live="polite"></div>

  <footer style="text-align:center; margin-top:22px; color:#666; font-size:13px;">
    © Career Direction
  </footer>

<script>
  // Realtime Database base URL (update if your DB URL differs)
  const RTDB_BASE = "https://cd-certificate-verification-default-rtdb.firebaseio.com";

  const certInput = document.getElementById('certID');
  const resultDiv = document.getElementById('result');
  const btn = document.getElementById('btnVerify');

  btn.addEventListener('click', verify);
  certInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') verify();
  });

  async function verify() {
    const id = certInput.value.trim();
    if (!id) {
      resultDiv.innerHTML = '<p class="invalid">Please enter a Certificate or Hackathon ID.</p>';
      return;
    }

    resultDiv.innerHTML = '<p class="small">Checking…</p>';

    try {
      const resp = await fetch(`${RTDB_BASE}/${encodeURIComponent(id)}.json`);
      if (!resp.ok) {
        resultDiv.innerHTML = '<p class="invalid">Network error. Try again.</p>';
        return;
      }
      const data = await resp.json();

      if (!data) {
        resultDiv.innerHTML = `<p class="invalid">❌ Certificate not found or invalid ID.</p>`;
        return;
      }

      // Build result UI: handle both certification & hackathon records
      const lines = [];

      lines.push('<p class="valid">✔ Verified</p>');
      lines.push(`<p><span class="key">ID</span> ${escapeHtml(data.id || id)}</p>`);
      lines.push(`<p><span class="key">Name</span> ${escapeHtml(data.name || '—')}</p>`);

      // Certification style
      if (data.certification) {
        lines.push(`<p><span class="key">Certification</span> ${escapeHtml(data.certification)}</p>`);
        if (data.issued_on) lines.push(`<p><span class="key">Issued On</span> ${escapeHtml(data.issued_on)}</p>`);
        if (data.expiry_on) lines.push(`<p><span class="key">Expiry On</span> ${escapeHtml(data.expiry_on)}</p>`);
        if (data.grade) lines.push(`<p><span class="key">Grade</span> ${escapeHtml(data.grade)}</p>`);
      }

      // Hackathon style
      if (data.hackathon) {
        lines.push(`<p><span class="key">Event</span> ${escapeHtml(data.hackathon)}</p>`);
        if (data.achievement_level) lines.push(`<p><span class="key">Achievement</span> ${escapeHtml(data.achievement_level)}</p>`);
        if (data.location) lines.push(`<p><span class="key">Location</span> ${escapeHtml(data.location)}</p>`);
      }

      // Common fields
      if (data.issuer) lines.push(`<p><span class="key">Issuer</span> ${escapeHtml(data.issuer)}</p>`);
      if (data.status) lines.push(`<p><span class="key">Status</span> ${escapeHtml(data.status)}</p>`);

      lines.push('<hr>');
      lines.push('<p style="text-align:center; font-size:16px; font-weight:600; color:#444;">😊 Wish You Continued Success!</p>');

      resultDiv.innerHTML = lines.join('\n');

    } catch (err) {
      console.error(err);
      resultDiv.innerHTML = '<p class="invalid">Error connecting to database. Check your network or DB URL.</p>';
    }
  }

  // If an id is present in the query string, auto-run verify
  (function autoFromQuery() {
    const q = new URLSearchParams(window.location.search).get('id');
    if (q) {
      certInput.value = q;
      verify();
    }
  })();

  // simple HTML escape
  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }
</script>

</body>
</html>
