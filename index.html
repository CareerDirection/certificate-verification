<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Certificate Verification</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 40px;
    }
    input {
      padding: 10px;
      width: 260px;
      margin-right: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
    }
    #result {
      margin-top: 25px;
      font-size: 18px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }
    p {
      margin: 6px 0;
    }
    .valid {
      color: green;
      font-weight: bold;
    }
    .invalid {
      color: red;
      font-weight: bold;
    }
    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #555;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- Logo -->
  <div style="text-align:center; margin-bottom:20px;">
    <img src="logo.png" width="160" alt="Career Direction Logo">
  </div>

  <h1>Course Certificate Verification</h1>

  <p style="margin-top:10px; margin-bottom:20px;">
    Enter your Certificate ID below.
  </p>

  <input 
    type="text" 
    id="certID" 
    placeholder="Enter Cert-ID (CDCERT2025-000)" 
  />
  <button onclick="verify()">Verify</button>

  <div id="result"></div>

  <footer>
    © Career Direction - All Rights Reserved
  </footer>

  <script>
    const BASE_URL = "https://cd-certificate-verification-default-rtdb.firebaseio.com";

    async function verify() {
      const certID = document.getElementById("certID").value.trim();
      const resultDiv = document.getElementById("result");

      if (!certID) {
        resultDiv.innerHTML = "<p class='invalid'>Please enter a Certificate ID.</p>";
        return;
      }

      resultDiv.innerHTML = "<em>Checking...</em>";

      try {
        const response = await fetch(`${BASE_URL}/${certID}.json`);
        const data = await response.json();

        if (!data) {
          resultDiv.innerHTML = "<p class='invalid'>❌ Certificate not found or invalid.</p>";
          return;
        }

        let html = `
          <p class="valid">✔ Certificate Verified</p>
          <p><strong>Name:</strong> ${data.name || "-"}</p>
          <p><strong>Certificate ID:</strong> ${data.id || certID}</p>
        `;

        if (data.certification) {
          html += `<p><strong>Certification:</strong> ${data.certification}</p>`;
        }
        if (data.hackathon) {
          html += `<p><strong>Hackathon:</strong> ${data.hackathon}</p>`;
        }
        if (data.achievement_level) {
          html += `<p><strong>Achievement:</strong> ${data.achievement_level}</p>`;
        }
        if (data.location) {
          html += `<p><strong>Location:</strong> ${data.location}</p>`;
        }

        html += `
          <p><strong>Issuer:</strong> ${data.issuer || "Career Direction"}</p>
          <p><strong>Status:</strong> ${data.status || "-"}</p>
          <hr>
          <p style="font-size:20px; font-weight:bold; color:#444; text-align:center;">
            😊 Wish You Continued Success!
          </p>
        `;

        resultDiv.innerHTML = html;

      } catch (error) {
        resultDiv.innerHTML = "<p class='invalid'>Error connecting to database.</p>";
      }
    }
  </script>

</body>
</html>
